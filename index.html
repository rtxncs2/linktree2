<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jac Sparrow · linktree</title>
  <!-- Font Awesome 6 (free) for subtle icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ---------- RESET & BASE ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(145deg, #f7f0eb 0%, #e8dfd7 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    /* subtle grain texture (optional) – gives warmth */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='1' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* main card – everything sits inside this glassy container */
    .linktree {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 3.5rem;
      padding: 2.8rem 2rem 2.5rem;
      max-width: 680px;
      width: 100%;
      box-shadow: 
        0 30px 50px -20px rgba(0, 0, 0, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.7) inset,
        0 0 0 1px rgba(210, 190, 170, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    /* ---------- AVATAR ---------- */
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ffffff;
      box-shadow: 0 15px 30px -8px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(200, 170, 140, 0.3);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      margin-bottom: 1.3rem;
    }

    .avatar:hover {
      transform: scale(1.02);
      box-shadow: 0 25px 35px -10px rgba(0, 0, 0, 0.3), 0 0 0 2px rgba(210, 170, 120, 0.6);
    }

    /* ---------- NAME ---------- */
    h1 {
      font-size: 2.4rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #2c241e;
      margin-bottom: 0.3rem;
      text-align: center;
      line-height: 1.2;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
    }

    /* small decorative line */
    .divider {
      width: 70px;
      height: 3px;
      background: linear-gradient(90deg, #d9b99b, #b28b6e, #d9b99b);
      border-radius: 10px;
      margin: 1.2rem 0 1.8rem;
      opacity: 0.7;
    }

    /* ---------- LINKS CONTAINER ---------- */
    .links-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* ---------- LINK BUTTONS ---------- */
    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1.1rem 1.6rem;
      background: #fefcf9;
      border-radius: 100px;
      text-decoration: none;
      font-weight: 500;
      font-size: 1.1rem;
      color: #3a2e25;
      box-shadow: 0 10px 18px -10px rgba(70, 50, 35, 0.15), 0 0 0 1px rgba(220, 200, 180, 0.5);
      transition: all 0.2s ease;
      letter-spacing: 0.01em;
      text-align: center;
      word-break: break-word;
      line-height: 1.3;
      position: relative;
      backdrop-filter: blur(4px);
    }

    /* left accent on hover */
    .link::before {
      content: '';
      position: absolute;
      left: 0;
      top: 20%;
      height: 60%;
      width: 4px;
      background: #c7a17a;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .link:hover {
      background: #ffffff;
      box-shadow: 0 18px 25px -12px rgba(80, 55, 35, 0.25), 0 0 0 2px #dbbc9b;
      transform: translateY(-3px);
      color: #1f1812;
    }

    .link:hover::before {
      opacity: 1;
    }

    /* subtle icon placeholder (using pseudo-element? we'll use emoji or leave clean) */
    /* But we want icons? – we can add small fontawesome icons via CSS classes, but I'll keep it minimal */
    /* Yet some links could have distinct labels, no icons needed – clean */

    /* ---------- FOOTER ---------- */
    footer {
      margin-top: 2.8rem;
      font-size: 0.9rem;
      color: #9b887a;
      text-align: center;
      letter-spacing: 0.3px;
      border-top: 1px solid rgba(180, 150, 130, 0.25);
      padding-top: 1.8rem;
      width: 100%;
      font-weight: 400;
      transition: color 0.2s;
    }

    footer:hover {
      color: #7a6658;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 480px) {
      .linktree {
        padding: 2rem 1.2rem 1.8rem;
        border-radius: 2.5rem;
      }

      h1 {
        font-size: 2rem;
      }

      .avatar {
        width: 100px;
        height: 100px;
      }

      .link {
        padding: 1rem 1.2rem;
        font-size: 1rem;
        gap: 0.5rem;
      }

      footer {
        margin-top: 2rem;
        font-size: 0.8rem;
      }
    }

    /* Fine tune spacing between avatar and name, but original had <br> – we removed */
  </style>
</head>
